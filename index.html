<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Car Info</title>
  <meta name="description" content="บันทึกการดูแลรถ ประวัติเติมน้ำมัน และคำนวณอัตราสิ้นเปลือง">
  <meta name="theme-color" content="#0a0507">
  <meta name="color-scheme" content="dark">
  <!-- iPhone: เปิดแบบเต็มจอเมื่อ "เพิ่มไปยังหน้าจอโฮม" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Car Info">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- ฉากหลัง aurora แดง-ดำ -->
  <div class="aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>

  <header class="topbar glass">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <div>
        <div class="brand-name">Car Info</div>
        <div class="brand-sub" id="headerOdo"></div>
      </div>
    </div>
    <label class="vehicle-pick" id="vehiclePickWrap" hidden>
      <span class="sr-only">เลือกรถ</span>
      <select id="vehicleSelect"></select>
    </label>
  </header>

  <main id="view" tabindex="-1"></main>

  <button class="fab" id="fab" type="button" aria-label="เพิ่มบันทึก" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar glass" aria-label="เมนูหลัก">
    <a href="#dashboard" data-tab="dashboard">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 1 1 16 0"/><path d="M12 13l4-4"/><path d="M4 17h16"/></svg>
      <span>ภาพรวม</span>
    </a>
    <a href="#fuel" data-tab="fuel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14"/><path d="M4 20h12"/><path d="M8 9h4"/><path d="M15 9l3 3v5a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
      <span>น้ำมัน</span>
    </a>
    <a href="#service" data-tab="service">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
      <span>ซ่อมบำรุง</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>รถ & ตั้งค่า</span>
    </a>
  </nav>

  <!-- แผ่นฟอร์มเลื่อนขึ้นจากด้านล่าง (ใช้ร่วมกันทุกฟอร์ม) -->
  <dialog id="sheet" class="sheet glass" aria-labelledby="sheetTitle">
    <div class="sheet-grip" aria-hidden="true"></div>
    <div id="sheetBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <noscript><p class="noscript">แอปนี้ต้องเปิด JavaScript</p></noscript>

  <script src="js/calc.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
